<nav class="mobile-conversion-bar" aria-label="Quick clinic actions">
  <a href="{% url 'appointments:request_for_clinic' clinic_slug=page.slug %}" data-analytics-event="appointment_click" data-analytics-clinic="{{ page.slug }}">Appointment</a>
  {% if page.phone_uri %}<a href="{{ page.phone_uri }}" data-analytics-event="phone_click" data-analytics-clinic="{{ page.slug }}">Call</a>{% endif %}
  {% if page.whatsapp_url %}<a href="{{ page.whatsapp_url }}" target="_blank" rel="noopener" data-analytics-event="whatsapp_click" data-analytics-clinic="{{ page.slug }}">WhatsApp</a>{% endif %}
  {% if page.google_maps_url %}<a href="{{ page.google_maps_url }}" target="_blank" rel="noopener" data-analytics-event="directions_click" data-analytics-clinic="{{ page.slug }}">Directions</a>{% endif %}
</nav>
